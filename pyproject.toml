[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omniscope"
version = "0.1.0"
description = "Unified CLI tool for oscilloscope control with manufacturer abstraction"
requires-python = ">=3.10"
dependencies = [
    "pyvisa",
    "pyvisa-py",
    "pyusb",
]

[project.scripts]
omniscope = "omniscope.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["omniscope*"]
